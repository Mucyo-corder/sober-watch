  <text x="96" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#3B82F6" letter-spacing="-0.5">Watch</text>
  <text x="48" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#94A3B8" letter-spacing="1.5">ALCOHOL MONITORING</text>
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
