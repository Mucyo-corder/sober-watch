  <path d="M12 20 Q16 18 20 20 Q24 22 28 20" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M12 26 Q16 24 20 26 Q24 28 28 26" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- Checkmark overlay -->
